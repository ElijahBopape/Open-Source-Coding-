name: Android CI

# Builds the app and runs its unit tests on every push/PR, so a broken build or
# failing test is caught immediately instead of only being noticed at submission
# time. Adapted from the pattern in:
# https://github.com/marketplace/actions/automated-build-android-app-with-github-action
# https://github.com/IMAD5112/Github-actions/blob/main/.github/workflows/build.yml
# (both accessed 03 November 2025).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
