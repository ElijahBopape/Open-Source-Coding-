name: Android CI

# Builds the app and runs all automated tests on every push/PR, so a broken build
# or failing test is caught immediately instead of only at submission time.
# Adapted from the pattern in:
# https://github.com/marketplace/actions/automated-build-android-app-with-github-action
# https://github.com/IMAD5112/Github-actions/blob/main/.github/workflows/build.yml
# (both accessed 03 November 2025).
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  api-tests:
    name: REST API tests (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run API tests
        run: npm test

  android:
    name: Android unit tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK and release bundle
        # The release bundle is unsigned in CI (the upload key never leaves the
        # developer's machine); this proves the R8-minified release build compiles.
        run: ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
