# Render "Blueprint" - lets Render auto-configure this service from this repo.
# See https://render.com/docs/blueprint-spec (Render, 2026).
#
# FIREBASE_SERVICE_ACCOUNT must be set in the Render dashboard (Environment tab)
# to the Firebase service-account JSON. "sync: false" means Render asks for the
# value instead of reading it from git, so the secret is never committed.
services:
  - type: web
    name: student-assistant-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
