plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.bopape.studentassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.bopape.studentassistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Base URL of the deployed REST API (see /backend). Replace this with your
        // own Render URL once deployed - see backend/README.md.
        buildConfigField "String", "API_BASE_URL", "\"https://student-assistant-api.onrender.com/\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 10.0.2.2 is the Android emulator's alias for the host machine's
            // localhost. Debug builds talk to the backend run locally with
            // `npm start` in /backend (see README) so the app works out of the
            // box without needing a live Render deployment.
            buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:3000/\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Core Android / Kotlin
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Lifecycle + coroutines, used to call the REST API off the main thread
    // https://developer.android.com/kotlin/coroutines (Android Developers, 2026)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Networking - Retrofit + Gson, used to talk to the custom REST API
    // https://square.github.io/retrofit/ (Square, 2026)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Firebase Authentication (email/password + Google Sign-In)
    // https://firebase.google.com/docs/auth/android/start (Google, 2026)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth-ktx'
    // Google Sign-In (com.google.android.gms:play-services-auth) will be added when
    // SSO is implemented for the Final PoE - it is explicitly a "PoE only" requirement.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
